# =============================================================
# Hyprland Config — Estilo Omarchy / Omadora
# Sistema: Fedora Atomic (hyprblue-br)
# Idioma: pt-BR (Teclado ABNT2)
# =============================================================

# ── Monitores ────────────────────────────────────────────────
# Configuração automática para telas internas e monitores DisplayLink
monitor = , preferred, auto, auto

# ── Variáveis padrão ─────────────────────────────────────────
$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$menu = rofi -show drun -show-icons
$browser = brave-browser
$editor = code

# ── Autostart ────────────────────────────────────────────────
# Barra superior, notificações e applets essenciais
exec-once = waybar
exec-once = swaync
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1 || /usr/libexec/polkit-kde-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swaybg -c '#1a1b26'

# ── Teclado e Entrada (pt-BR ABNT2) ──────────────────────────
input {
    kb_layout = br
    kb_variant = abnt2
    kb_model = abnt2
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }

    sensitivity = 0 # -1.0 a 1.0, 0 = padrão
}

# ── Estilo Visual & Aparência (Tokyo Night / Omarchy) ────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1b26ee)
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 6, myBezier
    animation = windowsOut, 1, 6, default, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ── Regras de Janelas ────────────────────────────────────────
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.kde.kcalc)$
windowrulev2 = float, title:^(Salvar como|Abrir arquivo).*$

# ── Atalhos de Teclado (Keybindings) ─────────────────────────
# Aplicativos principais
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, $menu
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, microsoft-edge-stable
bind = $mainMod CTRL, B, exec, google-chrome-stable
bind = $mainMod, C, exec, $editor
bind = $mainMod SHIFT, C, exec, kate

# Gerenciamento de Janelas
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Central de Notificações (SwayNC) e Bloqueio
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, L, exec, hyprlock

# Captura de Tela (Flameshot / Satty / Grim + Slurp)
bind = , Print, exec, grim -g "$(slurp)" - | satty --filename - || flameshot gui
bind = $mainMod, Print, exec, flameshot gui
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | satty --filename - || flameshot gui

# Navegação de Foco (Vim keys + Setas)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# Mover Janelas
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspaces (1 a 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Mover Janela para Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Teclas Multimídia & Brilho
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
