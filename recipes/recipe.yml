# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# ============================================================
# Hyprland Atômico (Fedora Atomic 44)
# Hyprland + DisplayLink + Estilo Omarchy + pt-BR
# Repositório: jose7570/hyprblue
# ============================================================
name: hyprblue-br
description: >
  Fedora Atomic 44 com Hyprland, ambiente estilo Omarchy,
  suporte completo ao idioma pt-BR (teclado ABNT2) e suite completa de desenvolvimento,
  navegadores e produtividade.
base-image: ghcr.io/wayblueorg/hyprland-gdm
image-version: 44

modules:

  - type: os-release
    properties:
      ID: fedora
      ID_LIKE: fedora
      VARIANT: "Hyprland Atomic"
      VARIANT_ID: "hyprland-atomic"
      PRETTY_NAME: "Fedora Atomic 44 (Hyprland)"
      HOME_URL: "https://fedoraproject.org/"
      DOCUMENTATION_URL: "https://docs.fedoraproject.org/"

  - type: dnf
    repos:
      nonfree: rpmfusion

  - type: dnf
    repos:
      copr:
        - scottames/ghostty
        - tofik/nwg-shell
        - atim/starship-fedora

      files:
        - "https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo"
        - "https://packages.microsoft.com/yumrepos/edge/config.repo"
        - "https://packages.microsoft.com/yumrepos/vscode/config.repo"

      keys:
        - "https://packages.microsoft.com/keys/microsoft.asc"

    install:
      packages:
      # ── Navegadores ───────────────────────────
      - brave-browser
      - microsoft-edge-stable

      # ── Desenvolvimento ───────────────────────
      - code                        # VS Code
      - neovim
      - git
      - curl
      - wget
      - tar
      - zstd
      - fuse-libs                   # Suporte a AppImages

      # ── Terminal / Shell / Prompt ─────────────
      - ghostty
      - starship
      - fastfetch

      # ── Ambiente Hyprland & Estilo Omarchy ────
      - waybar
      - rofi-wayland
      - swaynotificationcenter      # SwayNC
      - swaybg
      - hyprlock
      - hypridle
      - wl-clipboard
      - cliphist
      - grim
      - slurp
      - satty                       # Anotação de tela para Wayland
      - brightnessctl
      - pavucontrol
      - network-manager-applet
      - blueman
      - polkit-kde                  # Agente Polkit gráfico

      # ── DisplayLink ───────────────────────────
      #- displaylink

      # ── Editores e Visualizadores ─────────────
      - kate
      - okular

      # ── Utilitários do Sistema ────────────────
      - flameshot
      - bleachbit
      - btrfs-assistant
      - firewall-config

      # ── OCR (Tesseract + pt-BR) ───────────────
      - tesseract
      - tesseract-langpack-por
      - tesseract-langpack-eng
      # --------------------------------------------------------
        # Dicionários
        # --------------------------------------------------------
      - hunspell-pt-BR
      - hunspell-en-US
      - aspell-pt_BR
      - aspell-en

      # ── Multimídia e Rede ─────────────────────
      - vlc
      - qbittorrent
      - kdeconnect
      - krdc

      # ── Apps KDE / Segurança ──────────────────
      - dolphin
      - ark
      - filelight
      - kcalc
      - keepassxc
      - kleopatra
      - kgpg
      - kfind
      - plasma-emojier
      - spectacle

      # ── Fontes, Ícones ─────────
      - google-noto-fonts-common
      - google-noto-sans-fonts
      - google-noto-color-emoji-fonts
      - jetbrains-mono-nerd-fonts
      - fira-code-nerd-fonts
      - fontawesome-fonts-all
       # --------------------------------------------------------
        # Fontes
        # --------------------------------------------------------
      - langpacks-pt_BR
      - langpacks-en
      - glibc-langpack-pt
      - glibc-langpack-en

  # ──────────────────────────────────────────────
  # 5. Locale pt-BR como padrão do sistema
  # ──────────────────────────────────────────────
  - type: script
    snippets:
      - |
        cat > /etc/locale.conf <<'EOF'
        LANG=pt_BR.UTF-8
        LC_MESSAGES=pt_BR.UTF-8
        EOF

        cat > /etc/vconsole.conf <<'EOF'
        KEYMAP=br-abnt2
        EOF

  # ──────────────────────────────────────────────
  # 6. Google Chrome (RPM oficial via CDN)
  # ──────────────────────────────────────────────
  - type: script
    scripts:
      - install-chrome.sh

  # ──────────────────────────────────────────────
  # 7. Anki 26.08.1 (tar.zst oficial)
  # ──────────────────────────────────────────────
  - type: script
    scripts:
      - install-anki.sh

  # ──────────────────────────────────────────────
  # 8. JetBrains Toolbox (AppImage → /opt)
  # ──────────────────────────────────────────────
  - type: script
    scripts:
      - install-jetbrains-toolbox.sh

  # ──────────────────────────────────────────────
  # 9. XMind 26.05.01106 (RPM oficial via CDN)
  # ──────────────────────────────────────────────
  - type: script
    scripts:
      - install-xmind.sh

   # ============================================================
  # Bazaar / Flatpaks
  # ============================================================

  - type: default-flatpaks
    configurations:

      - scope: system
        repo:
          name: flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo

        install:
          - io.github.kolunmi.Bazaar

   # ──────────────────────────────────────────────
  # 12. Assinatura cosign da imagem
  # ──────────────────────────────────────────────
  - type: signing
