# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# ============================================================
# Hyprland Atômico (Fedora Atomic 44)
# Hyprland + DisplayLink + Estilo Omarchy + pt-BR
# Repositório: jose7570/hyprblue
# ============================================================
name: hyprblue-br
description: >
  Fedora Atomic 44 com Hyprland, ambiente estilo Omarchy,
  suporte completo ao idioma pt-BR (teclado ABNT2) e suite completa de desenvolvimento,
  navegadores e produtividade.
base-image: ghcr.io/wayblueorg/hyprland-gdm
image-version: 44

modules:

  # ──────────────────────────────────────────────
  # 1. Identidade do sistema operacional
  # ──────────────────────────────────────────────
  - type: os-release
    extra-fields:
      ID: fedora
      VARIANT: Hyprland Atômico
      VARIANT_ID: hyprland-atomic
      PRETTY_NAME: "Fedora Atomic 44 (Hyprland + Omarchy)"
      HOME_URL: "https://fedoraproject.org/"
      DOCUMENTATION_URL: "https://docs.fedoraproject.org/"

  # ──────────────────────────────────────────────
  # 2. Kernel Modules (DisplayLink / EVDI)
  # ──────────────────────────────────────────────
  #- type: akmods
   # base: main
   # install:
   #   - evdi

  # ──────────────────────────────────────────────
  # 3. RPMFusion (codecs e drivers extras)
  # ──────────────────────────────────────────────
  - type: dnf
    repos:
      nonfree:
        - rpmfusion

  # ──────────────────────────────────────────────
  # 4. Repositórios externos e pacotes do sistema
  # ──────────────────────────────────────────────
  - type: dnf
    repos:
      copr:
        #- crashdummy/Displaylink     # Daemon de espaço de usuário do DisplayLink
        - scottames/ghostty          # Ghostty terminal acelerado por GPU
        - tofik/nwg-shell            # Ferramentas Wayland complementares
        - atim/starship-fedora       # Prompt moderno Starship

      # Repos oficiais via .repo
      urls:
        # Brave Browser (oficial)
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        # Microsoft Edge
        - https://packages.microsoft.com/yumrepos/edge/config.repo
        # VS Code
        - https://packages.microsoft.com/yumrepos/vscode/config.repo

      # Chaves GPG dos repos Microsoft
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc

    install:
      # ── Navegadores ───────────────────────────
      - brave-origin-stable
      - microsoft-edge-stable

      # ── Desenvolvimento ───────────────────────
      - code                        # VS Code
      - neovim
      #- docker
      #- docker-compose
      - git
      - curl
      - wget
      - tar
      - zstd
      - fuse-libs                   # Suporte a AppImages

      # ── Terminal / Shell / Prompt ─────────────
      - ghostty
      - starship
      - fastfetch

      # ── Ambiente Hyprland & Estilo Omarchy ────
      - waybar
      - rofi-wayland
      - swaynotificationcenter      # SwayNC
      - swaybg
      - hyprlock
      - hypridle
      - wl-clipboard
      - cliphist
      - grim
      - slurp
      - satty                       # Anotação de tela para Wayland
      - brightnessctl
      - pavucontrol
      - network-manager-applet
      - blueman
      - polkit-kde                  # Agente Polkit gráfico

      # ── DisplayLink ───────────────────────────
      #- displaylink

      # ── Editores e Visualizadores ─────────────
      - kate
      - okular

      # ── Utilitários do Sistema ────────────────
      - flameshot
      - bleachbit
      - btrfs-assistant
      - firewall-config

      # ── OCR (Tesseract + pt-BR) ───────────────
      - tesseract
      - tesseract-langpack-por
      - tesseract-langpack-eng
      - hunspell-pt-BR
      - hunspell-en-US
      - aspell-pt_BR
      - aspell-en

      # ── Multimídia e Rede ─────────────────────
      - vlc
      - qbittorrent
      - kdeconnect
      - krdc

      # ── Apps KDE / Segurança ──────────────────
      - dolphin
      - ark
      - filelight
      - kcalc
      - keepassxc
      - kleopatra
      - kgpg
      - kfind
      - plasma-emojier
      - spectacle

      # ── Fontes, Ícones e Locale pt-BR ─────────
      - google-noto-fonts-common
      - google-noto-sans-fonts
      - google-noto-color-emoji-fonts
      - jetbrains-mono-nerd-fonts
      - fira-code-nerd-fonts
      - fontawesome-fonts-all
      - langpacks-pt_BR
      - glibc-langpack-pt
      - hunspell-pt-BR

  # ──────────────────────────────────────────────
  # 5. Locale pt-BR como padrão do sistema
  # ──────────────────────────────────────────────
  - type: script
    snippets:
      - |
        # Configura locale pt_BR.UTF-8 como padrão do sistema
        localectl set-locale LANG=pt_BR.UTF-8 || \
          echo "LANG=pt_BR.UTF-8" > /etc/locale.conf
        # Adiciona suporte a pt-BR no /etc/locale.gen se existir
        if [ -f /etc/locale.gen ]; then
          echo "pt_BR.UTF-8 UTF-8" >> /etc/locale.gen
          locale-gen || true
        fi

  # ──────────────────────────────────────────────
  # 6. Google Chrome (RPM oficial via CDN)
  # ──────────────────────────────────────────────
  - type: script
    scripts:
      - install-chrome.sh

  # ──────────────────────────────────────────────
  # 7. Anki 26.08.1 (tar.zst oficial)
  # ──────────────────────────────────────────────
  - type: script
    scripts:
      - install-anki.sh

  # ──────────────────────────────────────────────
  # 8. JetBrains Toolbox (AppImage → /opt)
  # ──────────────────────────────────────────────
  - type: script
    scripts:
      - install-jetbrains-toolbox.sh

  # ──────────────────────────────────────────────
  # 9. XMind 26.05.01106 (RPM oficial via CDN)
  # ──────────────────────────────────────────────
  - type: script
    scripts:
      - install-xmind.sh

  # ──────────────────────────────────────────────
  # 10. Docker & Serviços Systemd
  # ──────────────────────────────────────────────
  #- type: script
   # snippets:
     # - |
        # Garante a existência do grupo docker
      #  groupadd -r docker 2>/dev/null || true

  #- type: systemd
   # system:
    #  enabled:
        #- docker.service
        #- docker.socket
        #- displaylink.service

  # ──────────────────────────────────────────────
  # 11. Yafti — Instalador de Primeiro Boot
  #     (Bazaar, NotepadNext, LM Studio, etc.)
  # ──────────────────────────────────────────────
  - type: yafti
    include-default-config: false

  # ──────────────────────────────────────────────
  # 12. Assinatura cosign da imagem
  # ──────────────────────────────────────────────
  - type: signing
