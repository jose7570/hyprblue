name: Build Image

on:
  push:
    branches:
      - main
      - live
    paths-ignore:
      - "**.md"
      - "**.txt"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.txt"
  schedule:
    # Rebuild toda semana (segunda-feira às 00h UTC)
    - cron: "0 0 * * MON"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Image
        uses: blue-build/github-action@v1.8
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          use_unstable_cli: false

  iso:
    name: Generate Installer ISO
    needs: bluebuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image name from recipe
        id: image-info
        run: |
          IMAGE_NAME=$(grep '^name:' recipes/recipe.yml | awk '{print $2}')
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA::7}-44" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        id: isogen
        with:
          arch: x86_64
          image_name: ${{ steps.image-info.outputs.image_name }}
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: ${{ steps.image-info.outputs.image_tag }}
          version: "44"
          variant: Silverblue
          iso_name: ${{ steps.image-info.outputs.image_name }}-installer.iso
          enrollment_password: hyprblue

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image-info.outputs.image_name }}-installer
          path: ${{ steps.isogen.outputs.iso_path }}
          retention-days: 14
          compression-level: 0
