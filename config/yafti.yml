  # ── Tela final ────────────────────────────────────────
  final-screen:
    source: yafti.screen.title
    values:
      title: "Tudo pronto! 🎉"
      description: |
        Configuração concluída com sucesso.

        📌 Dicas Importantes:
        • O Hyprland já está configurado no estilo Omarchy com teclado ABNT2.
        • Atalhos principais:
          - Super + Return : Ghostty (terminal)
          - Super + Espaço : Rofi (menu de aplicativos)
          - Super + E      : Dolphin (arquivos)
          - Super + B      : Brave Browser
          - Super + C      : VS Code
          - Super + Print  : Flameshot / Captura
        • Para gerenciar Flatpaks graficamente, abra o Bazaar.
        • Para adicionar seu usuário ao grupo docker:
          sudo usermod -aG docker $USER  (requer logout)
        • JetBrains Toolbox está instalado em /opt/jetbrains-toolbox/
        • Anki e XMind estão disponíveis no menu de aplicativos.

        Aproveite o seu Fedora Atômico com Hyprland! 🪁
