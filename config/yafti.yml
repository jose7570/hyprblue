# =============================================================
# yafti.yml — Instalador de Primeiro Boot (Yet Another First-Time Installer)
# Apresenta uma seleção de Flatpaks opcionais na primeira vez
# que o usuário faz login após a instalação.
# =============================================================
title: "Bem-vindo ao Hyprland Atômico! 🪁"
properties:
  mode: "run-on-change"

screens:
  # ── Tela de boas-vindas ─────────────────────────────────
  first-screen:
    source: yafti.screen.welcome
    values:
      title: "Hyprland Atômico"
      description: |
        Sua imagem Fedora Atomic imutável com Hyprland e estilo Omarchy está pronta!

        Este assistente vai ajudá-lo a instalar aplicativos adicionais
        via Flatpak (Flathub). Você pode marcar o que deseja ou pular.

  # ── Configuração do Flatpak ────────────────────────────
  can-we-modify-your-flatpaks:
    source: yafti.screen.consent
    values:
      title: "Configurar Flatpak"
      condition:
        run: flatpak remotes --columns=name | grep -q "flathub"
        invert: true
      description: |
        Precisamos adicionar o repositório Flathub para instalar apps.
      actions:
        - run: >-
            flatpak remote-add --if-not-exists flathub
            https://flathub.org/repo/flathub.flatpakrepo

  # ── Seleção de aplicativos ─────────────────────────────
  applications:
    source: yafti.screen.package
    values:
      title: "Instalar Aplicativos"
      show_terminal: true
      package_manager: yafti.plugin.flatpak
      package_manager_defaults:
        user: false
        system: true

      groups:
        # ── Gerenciamento de Apps ────────────────────────
        "Lojas de Aplicativos":
          description: "Gerenciadores gráficos de Flatpaks"
          default: true
          packages:
            - Bazaar:
                description: "Loja moderna, leve e rápida de aplicativos Flatpak"
                flatpak: io.github.kolunmi.Bazaar

        # ── Inteligência Artificial ──────────────────────
        "IA & Modelos de Linguagem":
          description: "Ferramentas de IA local e produtividade"
          default: true
          packages:
            - LM Studio:
                description: "Interface para rodar LLMs localmente (Llama, Mistral, Gemma)"
                flatpak: ai.lmstudio.LMStudio

        # ── Produtividade & Notas ────────────────────────
        "Produtividade & Escritório":
          description: "Editores de texto, mapas mentais e diagramas"
          default: true
          packages:
            - NotepadNext:
                description: "Editor de texto avançado (Notepadng / clone moderno do Notepad++)"
                flatpak: com.github.dail8859.NotepadNext
            #- Drawio:
            #    description: "Criação de diagramas e fluxogramas profissionais (Draw.io)"
            #    flatpak: com.jgraph.drawio.desktop
            - Drawing:
                description: "Aplicativo intuitivo para desenhos e anotações rápidas (Drawy)"
                flatpak: com.github.maoschanz.drawing
            - LibreOffice:
                description: "Suíte Office completa"
                flatpak: org.libreoffice.LibreOffice

        # ── Dicionário & Idiomas ─────────────────────────
        "Dicionário & Idiomas":
          description: "Ferramentas de referência e tradução"
          default: true
          packages:
            - GoldenDict-ng:
                description: "Dicionário avançado multi-formato de última geração"
                flatpak: io.github.xiaoyifang.goldendict_ng

        # ── Comunicação ──────────────────────────────────
       # "Comunicação":
        #  description: "Mensageiros e colaboração"
        #  default: true
        #  packages:
         #   - Telegram:
         #       description: "Mensageiro Telegram Desktop"
         #       flatpak: org.telegram.desktop
         #   - Discord:
         #       description: "Discord — chat de voz, vídeo e comunidades"
         #       flatpak: com.discordapp.Discord
         #   - Slack:
         #       description: "Slack — comunicação e workspaces"
         #       flatpak: com.slack.Slack

        # ── Navegadores extras ────────────────────────────
        #"Navegadores Extras":
        #  description: "Outros navegadores web"
        #  default: false
        #  packages:
         #   - Firefox:
         #       description: "Mozilla Firefox oficial Flatpak"
         #       flatpak: org.mozilla.firefox

        # ── Desenvolvimento ────────────────────────────────
        "Desenvolvimento":
          description: "Clientes de banco de dados e teste de APIs"
          default: false
          packages:
            - DBeaver Community:
                description: "Cliente de banco de dados universal (SQL, Postgres, MySQL, etc.)"
                flatpak: io.dbeaver.DBeaverCommunity
            - Postman:
                description: "Plataforma de teste e desenvolvimento de APIs"
                flatpak: com.getpostman.Postman
            - Insomnia:
                description: "Cliente REST e GraphQL leve"
                flatpak: rest.insomnia.Insomnia

        # ── Multimídia ────────────────────────────────────
        #"Multimídia & Design":
        #  description: "Áudio, vídeo e gráficos"
        #  default: false
        #  packages:
          #  - Spotify:
          #      description: "Player de streaming de música Spotify"
          #      flatpak: com.spotify.Client
          #  - Kdenlive:
          #      description: "Editor de vídeo profissional"
          #      flatpak: org.kde.kdenlive
          #  - GIMP:
          #      description: "Editor avançado de imagens e fotos"
          #      flatpak: org.gimp.GIMP
          #  - Inkscape:
          #      description: "Editor de gráficos vetoriais SVG"
          #      flatpak: org.inkscape.Inkscape

        # ── Utilitários KDE extras ─────────────────────────
        "Utilitários KDE":
          description: "Apps KDE adicionais"
          default: true
          packages:
            - KClock:
                description: "Relógio mundial, alarmes e cronômetro"
                flatpak: org.kde.kclock

        # ── Jogos ─────────────────────────────────────────
        #"Jogos":
        #  description: "Plataformas de games"
        #  default: false
        #  packages:
        #    - Steam:
        #        description: "Plataforma Steam da Valve"
        #        flatpak: com.valvesoftware.Steam
        #    - Lutris:
        #        description: "Gerenciador de jogos (Wine, GOG, Epic)"
        #        flatpak: net.lutris.Lutris

  # ── Tela final ────────────────────────────────────────
  final-screen:
    source: yafti.screen.title
    values:
      title: "Tudo pronto! 🎉"
      description: |
        Configuração concluída com sucesso.

        📌 Dicas Importantes:
        • O Hyprland já está configurado no estilo Omarchy com teclado ABNT2.
        • Atalhos principais:
          - Super + Return : Ghostty (terminal)
          - Super + Espaço : Rofi (menu de aplicativos)
          - Super + E      : Dolphin (arquivos)
          - Super + B      : Brave Browser
          - Super + C      : VS Code
          - Super + Print  : Flameshot / Captura
        • Para gerenciar Flatpaks graficamente, abra o Bazaar.
        • Para adicionar seu usuário ao grupo docker:
          sudo usermod -aG docker $USER  (requer logout)
        • JetBrains Toolbox está instalado em /opt/jetbrains-toolbox/
        • Anki e XMind estão disponíveis no menu de aplicativos.

        Aproveite o seu Fedora Atômico com Hyprland! 🪁
